<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E75"/>
    </marker>
  </defs>
  <rect width="780" height="320" fill="#FFFFFF"/>
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#16212C">EduERP — KUMUSH Store Flow</text>

  <rect x="20" y="70" width="160" height="60" rx="10" fill="#F4F5F2" stroke="#DCE0DA"/>
  <text x="100" y="95" text-anchor="middle" font-size="12" fill="#16212C" font-weight="600">Student</text>
  <text x="100" y="112" text-anchor="middle" font-size="10" fill="#55606B">requests StoreItem</text>
  <line x1="180" y1="100" x2="216" y2="100" stroke="#0B6E75" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="216" y="70" width="180" height="60" rx="10" fill="#DCEEEE" stroke="#0B6E75"/>
  <text x="306" y="92" text-anchor="middle" font-size="12" fill="#16212C" font-weight="600">PurchaseRequest</text>
  <text x="306" y="108" text-anchor="middle" font-size="10" fill="#55606B">status = pending</text>
  <line x1="396" y1="100" x2="432" y2="100" stroke="#0B6E75" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="432" y="70" width="160" height="60" rx="10" fill="#F4F5F2" stroke="#DCE0DA"/>
  <text x="512" y="92" text-anchor="middle" font-size="12" fill="#16212C" font-weight="600">Admin decision</text>
  <text x="512" y="108" text-anchor="middle" font-size="10" fill="#55606B">approve / reject</text>
  <line x1="512" y1="130" x2="512" y2="166" stroke="#0B6E75" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="380" y="166" width="264" height="60" rx="10" fill="#122029" stroke="#0B6E75"/>
  <text x="512" y="188" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">KumushTransaction</text>
  <text x="512" y="204" text-anchor="middle" font-size="10" fill="#9BADB8">balance_after recorded per transaction</text>

  <text x="512" y="248" text-anchor="middle" font-size="10" fill="#8A939B">Status lifecycle: pending → approved / rejected → cancelled / refunded</text>
  <text x="512" y="266" text-anchor="middle" font-size="10" fill="#8A939B">Manual balance adjustments and the full Kumush ledger are covered by</text>
  <text x="512" y="282" text-anchor="middle" font-size="10" fill="#8A939B">apps/store/tests: test_purchase_lifecycle.py, test_manual_adjustment.py, test_kumush_security.py</text>
</svg>
